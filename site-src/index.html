<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toronto Public Art Map</title>
<meta name="description" content="Outdoor public art, civic statuary and architectural art in downtown Toronto, reachable on foot or by bike.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1>Toronto Public Art Map</h1>
    <p id="sub">Outdoor public art in downtown Toronto, by foot or bike.</p>
  </div>
  <nav>
    <a href="https://github.com/brianerdelyi/tpam" rel="noopener">Source &amp; data</a>
    <a href="https://github.com/brianerdelyi/tpam/issues/new?template=correction.md" rel="noopener">Report a correction</a>
  </nav>
</header>
<p id="notice" role="note">Work in progress: credits have not yet been checked against sources.</p>
<main>
  <section id="mapwrap" aria-label="Map">
    <div id="map"></div>
    <p class="hint">Use the map's legend to show or hide groups, and tap a pin for details.</p>
  </section>
  <section id="catalogue" aria-label="The works">
    <h2 id="cat-title">The works</h2>
    <div id="zones"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
