<text x="90" y="862" font-size="11" fill="#555">Boundaries are approximate guidelines. East is assumed to start at Front St on its south edge. Midtown takes precedence where zones overlap.</text>
<text x="90" y="878" font-size="11" fill="#555">Some works sit outside their zone boundary by design (e.g. Time: And a Clock Part 3, east of Broadview).</text>
